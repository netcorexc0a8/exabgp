# ExaBGP -> downstream BGP router
#
# Lab defaults:
#   ExaBGP: 192.168.80.10 / AS 65001
#   Router:  192.168.80.1  / AS 65000
#
# Change these three values for your lab.

neighbor 192.168.80.1 {
    router-id 192.168.80.10;
    local-address 192.168.80.10;
    local-as 65001;
    peer-as 65000;

    family {
        ipv4 unicast;
    }

    api {
        processes [ routes ];
    }
}

process routes {
    run python3 -u /opt/fetcher/fetcher.py;
    encoder text;
}
