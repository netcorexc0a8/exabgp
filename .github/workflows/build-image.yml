name: Build Docker image and binary

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required for creating releases and uploading assets
  actions: write
  attestations: write

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary:
    name: Build and publish binary
    runs-on: ubuntu-latest
    # Only run on tag pushes — we don't need a binary for every commit
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ExaBGP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pip install --no-cache-dir "exabgp==${VERSION}"

      - name: Locate exabgp binary
        id: locate
        run: |
          BIN=$(which exabgp)
          echo "Binary path: $BIN"
          echo "path=$BIN" >> $GITHUB_OUTPUT

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH=$(uname -m)
          tar -czf "exabgp_${VERSION}_linux_${ARCH}.tar.gz" \
            -C "$(dirname "${{ steps.locate.outputs.path }}")" \
            exabgp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: exabgp_*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}