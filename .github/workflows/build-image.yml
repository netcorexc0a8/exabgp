name: Build Docker image and binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binary:
    name: binary-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract ExaBGP version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP 'ARG EXABGP_VERSION=\K\S+' Dockerfile)
          echo "ExaBGP version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ExaBGP
        run: |
          pip install --no-cache-dir "exabgp==${{ steps.version.outputs.version }}"

      - name: Package binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          BIN=$(which exabgp)
          DIR=$(dirname "$BIN")
          tar -czf "exabgp_${VERSION}_linux_${ARCH}.tar.gz" -C "$DIR" exabgp
          echo "Created exabgp_${VERSION}_linux_${ARCH}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: exabgp-linux-${{ matrix.arch }}
          path: exabgp_*_linux_*.tar.gz

  docker:
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: exabgp-*
          merge-multiple: true

      - name: Prepare assets
        run: |
          cd dist
          sha256sum exabgp_*_linux_*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cp "${{ github.workspace }}/install.sh" .
          chmod +x install.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') }}